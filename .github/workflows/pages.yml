name: Deploy GitHub Pages

on:
  # Deliberately unfiltered: the job takes ~30s, and changes that break it
  # (tooling, other workflows, repo config) routinely touch none of the paths
  # below. Every pull request validates the site.
  pull_request:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build_leaderboard.py"
      - "scripts/check_datasets.py"
      - "scripts/check_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Validate site entrypoint
        run: |
          test -f docs/index.html
          test -f docs/leaderboard/index.html
          test -f docs/assets/styles.css
          test -f docs/assets/site.js
          test -f docs/assets/leaderboard.css
          test -f docs/assets/leaderboard.js
          test -f docs/assets/dataset-pipeline.js
          test -f docs/assets/og.png
          test -f docs/data/datasets.json
          # Removing this file clears the custom domain in the Pages settings.
          test "$(cat docs/CNAME)" = "lepiszcze.clarin-pl.eu"

      - name: Validate leaderboard snapshot
        run: python3 scripts/build_leaderboard.py --check docs/data/leaderboard.json

      - name: Validate dataset registry
        run: python3 scripts/check_datasets.py docs/data/datasets.json

      - name: Validate static site
        run: |
          python3 scripts/check_site.py docs
          node --check docs/assets/site.js
          node --check docs/assets/leaderboard.js
          node --check docs/assets/dataset-pipeline.js

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
